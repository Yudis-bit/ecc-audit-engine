[workspace]
resolver = "2"
members = [
  "crates/model",
  "crates/corpus",
  "crates/target-api",
  "crates/runner",
  "crates/differential",
  "crates/timing",
  "crates/trace",
  "crates/minimizer",
  "crates/report",
  "crates/dyntrace",
  "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ecc-audit-engine"]

[workspace.dependencies]
num-bigint = { version = "0.5", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.10"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
libloading = "0.9"
model = { path = "crates/model" }
corpus = { path = "crates/corpus" }
target-api = { path = "crates/target-api" }
runner = { path = "crates/runner" }
differential = { path = "crates/differential" }
timing = { path = "crates/timing" }
trace = { path = "crates/trace" }
minimizer = { path = "crates/minimizer" }
report = { path = "crates/report" }
dyntrace = { path = "crates/dyntrace" }
